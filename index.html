<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Quantum Orbital Simulator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script src="kernel.js"></script>

    <style>
        :root {
            /* Muted Dark Palette */
            --bg-deep-blue: #0d1117;
            --panel-dark-gray: #161b22;
            --panel-border: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #30363d;
            
            /* Subtle Accent Colors */
            --accent-orange: #e69d45;
            --accent-orange-soft: rgba(230, 157, 69, 0.15);
            --text-white: #f0f6fc;
            --text-muted: #8b949e;
            
            /* Low-saturation Orbital Colors */
            --orb-s: #d96b6b;
            --orb-p: #7aa2f7;
            --orb-d: #e69d45;
            --orb-f: #b490db;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            padding: 28px;
            background-color: var(--bg-deep-blue);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1240px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-orange);
            border-radius: 50%;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1240px;
            width: 100%;
        }

        /* Low-key Dark Panel */
        .control-panel {
            width: 290px;
            background: var(--panel-dark-gray);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            padding: 9px 12px;
            border: 1px solid var(--panel-border);
            background: var(--btn-bg);
            color: var(--text-white);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }

        button:hover {
            border-color: var(--accent-orange);
            background: var(--btn-hover);
        }

        /* Range Slider Controls */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-orange);
            cursor: pointer;
            background: var(--btn-bg);
        }

        /* Checkboxes List */
        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-white);
            cursor: pointer;
        }

        .checkbox-item input {
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* GeoGebra 3D Viewport Frame */
        .applet-container {
            flex-grow: 1;
            background: var(--bg-deep-blue);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
        }

        #ggb-element {
            width: 100%;
            height: 650px;
        }
    </style>
</head>
<body>

    <header>
        <h1>QUANTUM ORBITAL MODEL</h1>
    </header>

    <div class="container">
        <!-- Left Subdued Control Panel -->
        <div class="control-panel">
            <!-- Element Selector -->
            <div>
                <div class="section-title">SELECT ELEMENT</div>
                <div class="btn-group">
                    <button onclick="loadElement('C')"><span>Carbon</span> <span style="color:var(--text-muted);">Z=6</span></button>
                    <button onclick="loadElement('Fe')"><span>Iron</span> <span style="color:var(--text-muted);">Z=26</span></button>
                    <button onclick="loadElement('Mo')"><span>Molybdenum</span> <span style="color:var(--text-muted);">Z=42</span></button>
                </div>
            </div>

            <!-- Opacity Control -->
            <div class="slider-group">
                <div class="section-title">DENSITY CONTROL</div>
                <div class="label-row">
                    <span>Opacity</span>
                    <span id="opacityVal" style="color:var(--accent-orange);">35%</span>
                </div>
                <input type="range" min="0.05" max="1" step="0.05" value="0.35" oninput="setOpacityFromUI(this.value)">
            </div>

            <!-- Orbital Filter -->
            <div>
                <div class="section-title">ORBITAL FILTER</div>
                <div class="checkbox-list">
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-s);"></span>s Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(0, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-p);"></span>p Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(1, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-d);"></span>d Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(2, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-f);"></span>f Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(3, this.checked)">
                    </label>
                </div>
            </div>
        </div>

        <!-- Right 3D Viewport -->
        <div class="applet-container">
            <div id="ggb-element"></div>
        </div>
    </div>

    <!-- GeoGebra Configuration -->
    <script>
        var params = {
            "appName": "3d",
            "perspective": "5",
            "width": 900,
            "height": 650,
            "showToolBar": false,
            "showAlgebraView": false,
            "showMenuBar": false,
            "enable3D": true,
            "appletOnLoad": function(api) {
                window.ggbApplet = api;
                if (typeof ggbOnInit === "function") {
                    ggbOnInit();
                }
            }
        };

        var applet = new GGBApplet(params, true);
        window.addEventListener("load", function() {
            applet.inject('ggb-element');
        });
    </script>
</body>
</html>
