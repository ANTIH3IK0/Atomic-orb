<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Quantum Orbital Simulator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script src="kernel.js"></script>

    <style>
        :root {
            /* Low-key Dark Gradient Palette */
            --bg-gradient: linear-gradient(180deg, #080a0f 0%, #0d1117 100%);
            --panel-gradient: linear-gradient(145deg, #161b22 0%, #11151c 100%);
            --panel-border: #21262d;
            --input-bg: #0d1117;
            --btn-gradient: linear-gradient(180deg, #21262d 0%, #191e26 100%);
            --btn-hover-gradient: linear-gradient(180deg, #2d333b 0%, #21262d 100%);
            
            /* Subtle Orange Accents & Muted Colors */
            --accent-amber: #d99b4e;
            --accent-amber-soft: rgba(217, 155, 78, 0.12);
            --text-main: #e6edf3;
            --text-muted: #7d8590;

            --orb-s: #c96a6a;
            --orb-p: #6888c4;
            --orb-d: #d99b4e;
            --orb-f: #9e82c4;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1240px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-amber);
            border-radius: 50%;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1240px;
            width: 100%;
        }

        /* Subdued Dark Panel with Subtle Gradient */
        .control-panel {
            width: 320px;
            background: var(--panel-gradient);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* Preset Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        button.preset-btn {
            padding: 8px 6px;
            border: 1px solid var(--panel-border);
            background: var(--btn-gradient);
            color: var(--text-main);
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        button.preset-btn:hover {
            border-color: var(--accent-amber);
            background: var(--btn-hover-gradient);
        }

        /* Custom Inputs */
        .input-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-row label {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .input-row input {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-row input:focus {
            outline: none;
            border-color: var(--accent-amber);
        }

        button.apply-btn {
            margin-top: 4px;
            padding: 8px;
            border: 1px solid var(--accent-amber);
            background: var(--accent-amber-soft);
            color: var(--accent-amber);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button.apply-btn:hover {
            background: var(--accent-amber);
            color: #0d1117;
        }

        /* Controls */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-amber);
            cursor: pointer;
        }

        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
        }

        .checkbox-item input {
            accent-color: var(--accent-amber);
            cursor: pointer;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* 3D Viewport */
        .applet-container {
            flex-grow: 1;
            background: #080a0f;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
        }

        #ggb-element {
            width: 100%;
            height: 680px;
        }
    </style>
</head>
<body>

    <header>
        <h1>QUANTUM ORBITAL MODEL SIMULATOR</h1>
    </header>

    <div class="container">
        <div class="control-panel">
            <!-- Presets -->
            <div>
                <div class="section-title">PRESETS</div>
                <div class="btn-group">
                    <button class="preset-btn" onclick="loadElement('C')">Carbon</button>
                    <button class="preset-btn" onclick="loadElement('Fe')">Iron</button>
                    <button class="preset-btn" onclick="loadElement('Mo')">Molybdenum</button>
                </div>
            </div>

            <!-- Custom Controls -->
            <div>
                <div class="section-title">CUSTOM PARAMETERS</div>
                <div class="input-form">
                    <div class="input-row">
                        <label>Atomic Number (Z)</label>
                        <input type="number" id="inputZ" value="42">
                    </div>
                    <div class="input-row">
                        <label>Electrons (elec)</label>
                        <input type="text" id="inputElec" value="2, 8, 8, 10, 8, 5, 1">
                    </div>
                    <div class="input-row">
                        <label>Principal Quantum (n)</label>
                        <input type="text" id="inputN" value="1, 2, 3, 3, 4, 4, 5">
                    </div>
                    <div class="input-row">
                        <label>Azimuthal Quantum (l)</label>
                        <input type="text" id="inputL" value="0, 1, 1, 2, 1, 2, 0">
                    </div>
                    <div class="input-row">
                        <label>Binding Energies En (eV)</label>
                        <input type="text" id="inputEn" value="-23658.82, -4872.96, -1429.45, -657.19, -201.81, -21.03, -7.4">
                    </div>
                    <button class="apply-btn" onclick="applyCustomParameters()">UPDATE MODEL</button>
                </div>
            </div>

            <!-- Opacity Control -->
            <div class="slider-group">
                <div class="section-title">DENSITY CONTROL</div>
                <div class="label-row">
                    <span>Opacity</span>
                    <span id="opacityVal" style="color:var(--accent-amber);">35%</span>
                </div>
                <input type="range" min="0.05" max="1" step="0.05" value="0.35" oninput="setOpacityFromUI(this.value)">
            </div>

            <!-- Filter -->
            <div>
                <div class="section-title">ORBITAL FILTER</div>
                <div class="checkbox-list">
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-s);"></span>s Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(0, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-p);"></span>p Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(1, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-d);"></span>d Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(2, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-f);"></span>f Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(3, this.checked)">
                    </label>
                </div>
            </div>
        </div>

        <div class="applet-container">
            <div id="ggb-element"></div>
        </div>
    </div>

    <script>
        var params = {
            "appName": "3d",
            "perspective": "5",
            "width": 880,
            "height": 680,
            "showToolBar": false,
            "showAlgebraView": false,
            "showMenuBar": false,
            "enable3D": true,
            "appletOnLoad": function(api) {
                window.ggbApplet = api;
                if (typeof ggbOnInit === "function") {
                    ggbOnInit();
                }
            }
        };

        var applet = new GGBApplet(params, true);
        window.addEventListener("load", function() {
            applet.inject('ggb-element');
        });
    </script>
</body>
</html>
