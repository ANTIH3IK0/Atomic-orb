<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Orbital Model</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script src="kernel.js"></script>

    <style>
        :root {
            /* Ultra-Modern Dark Palette with Slight Warm Tone */
            --bg-gradient: linear-gradient(165deg, #06070a 0%, #0d0f14 100%);
            --panel-gradient: linear-gradient(180deg, #111319 0%, #0c0e12 100%);
            --border-subtle: #1c1f26;
            --border-hover: #2d323e;
            
            --input-bg: #07080b;
            --btn-gradient: linear-gradient(180deg, #161920 0%, #111319 100%);
            --btn-hover: linear-gradient(180deg, #20242e 0%, #161920 100%);

            /* Subdued Off-White Text with Subtle Warm Yellow Tint */
            --text-warm-white: #e5e2da;
            --text-muted: #727068;
            --accent-warm-gold: #c89b52;
            --accent-warm-gold-soft: rgba(200, 155, 82, 0.08);

            --orb-s: #be5e5e;
            --orb-p: #5e87be;
            --orb-d: #c89b52;
            --orb-f: #9173be;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            margin: 0;
            padding: 28px;
            background: var(--bg-gradient);
            color: var(--text-warm-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1240px;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: var(--text-warm-white);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            background: var(--accent-warm-gold);
            border-radius: 50%;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 24px;
            max-width: 1240px;
            width: 100%;
        }

        .control-panel {
            width: 320px;
            background: var(--panel-gradient);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        button.preset-btn {
            padding: 8px 6px;
            border: 1px solid var(--border-subtle);
            background: var(--btn-gradient);
            color: var(--text-warm-white);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        button.preset-btn:hover {
            border-color: var(--border-hover);
            background: var(--btn-hover);
        }

        .input-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.15) 100%);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-row label {
            font-size: 10px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .input-row input {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-warm-white);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s ease;
        }

        .input-row input:focus {
            outline: none;
            border-color: var(--accent-warm-gold);
        }

        button.apply-btn {
            margin-top: 4px;
            padding: 8px;
            border: 1px solid var(--accent-warm-gold);
            background: var(--accent-warm-gold-soft);
            color: var(--accent-warm-gold);
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.apply-btn:hover {
            background: var(--accent-warm-gold);
            color: #07080b;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-warm-gold);
            cursor: pointer;
        }

        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-warm-white);
            cursor: pointer;
        }

        .checkbox-item input {
            accent-color: var(--accent-warm-gold);
            cursor: pointer;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .applet-container {
            flex-grow: 1;
            background: #06070a;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        }

        #ggb-element {
            width: 100%;
            height: 680px;
        }
    </style>
</head>
<body>

    <header>
        <h1>QUANTUM ORBITAL MODEL</h1>
    </header>

    <div class="container">
        <div class="control-panel">
            <div>
                <div class="section-title">PRESETS</div>
                <div class="btn-group">
                    <button class="preset-btn" onclick="loadElement('C')">Carbon</button>
                    <button class="preset-btn" onclick="loadElement('Fe')">Iron</button>
                    <button class="preset-btn" onclick="loadElement('Mo')">Molybdenum</button>
                </div>
            </div>

            <div>
                <div class="section-title">CUSTOM PARAMETERS</div>
                <div class="input-form">
                    <div class="input-row">
                        <label>Atomic Number (Z)</label>
                        <input type="number" id="inputZ" value="42">
                    </div>
                    <div class="input-row">
                        <label>Electrons (elec)</label>
                        <input type="text" id="inputElec" value="2, 8, 8, 10, 8, 5, 1">
                    </div>
                    <div class="input-row">
                        <label>Principal Quantum (n)</label>
                        <input type="text" id="inputN" value="1, 2, 3, 3, 4, 4, 5">
                    </div>
                    <div class="input-row">
                        <label>Azimuthal Quantum (l)</label>
                        <input type="text" id="inputL" value="0, 1, 1, 2, 1, 2, 0">
                    </div>
                    <div class="input-row">
                        <label>Binding Energies En (eV)</label>
                        <input type="text" id="inputEn" value="-23658.82, -4872.96, -1429.45, -657.19, -201.81, -21.03, -7.4">
                    </div>
                    <button class="apply-btn" onclick="applyCustomParameters()">UPDATE MODEL</button>
                </div>
            </div>

            <div class="slider-group">
                <div class="section-title">DENSITY CONTROL</div>
                <div class="label-row">
                    <span>Opacity</span>
                    <span id="opacityVal" style="color:var(--accent-warm-gold);">35%</span>
                </div>
                <input type="range" min="0.05" max="1" step="0.05" value="0.35" oninput="setOpacityFromUI(this.value)">
            </div>

            <div>
                <div class="section-title">ORBITAL FILTER</div>
                <div class="checkbox-list">
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-s);"></span>s Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(0, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-p);"></span>p Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(1, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-d);"></span>d Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(2, this.checked)">
                    </label>
                    <label class="checkbox-item">
                        <span><span class="dot" style="background:var(--orb-f);"></span>f Orbital</span>
                        <input type="checkbox" checked onchange="toggleOrbitalUI(3, this.checked)">
                    </label>
                </div>
            </div>
        </div>

        <div class="applet-container">
            <div id="ggb-element"></div>
        </div>
    </div>

    <script>
        var params = {
            "appName": "3d",
            "perspective": "5",
            "width": 880,
            "height": 680,
            "showToolBar": false,
            "showAlgebraView": false,
            "showMenuBar": false,
            "enable3D": true,
            "appletOnLoad": function(api) {
                window.ggbApplet = api;
                if (typeof ggbOnInit === "function") {
                    ggbOnInit();
                }
            }
        };

        var applet = new GGBApplet(params, true);
        window.addEventListener("load", function() {
            applet.inject('ggb-element');
        });
    </script>
</body>
</html>
