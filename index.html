<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic Quantum Orbital Visualizer (Atomic-orb web edition v1.5)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="kernel.js" defer></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(165deg, #050608 0%, #0a0c10 100%);
            --panel-gradient: linear-gradient(180deg, #101216 0%, #0a0c0f 100%);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(200, 155, 82, 0.4);
            
            --input-bg: #060709;
            --btn-gradient: linear-gradient(180deg, #151820 0%, #0e1015 100%);
            --btn-hover: linear-gradient(180deg, #1f232e 0%, #151820 100%);

            --text-warm-white: #e5e2da;
            --text-muted: #6e6c64;
            --accent-gold: #c89b52;
            --accent-gold-soft: rgba(200, 155, 82, 0.1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-warm-white);
            overflow: hidden;
            display: flex;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }

        /* Responsive Side Panel */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            background: var(--panel-gradient);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 10;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .ui-overlay.collapsed {
            transform: translateX(-360px);
            opacity: 0;
            pointer-events: none;
        }

        /* Top-Right Camera Control Panel (GOTO & Initial Position) */
        .tp-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 260px;
            background: var(--panel-gradient);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .tp-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tp-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .tp-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tp-field label {
            font-size: 9px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }

        .tp-field input {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-warm-white);
            padding: 6px 4px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }

        .tp-field input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .tp-coords-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .restore-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9;
            background: var(--panel-gradient);
            border: 1px solid var(--border-subtle);
            color: var(--accent-gold);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .restore-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-warm-white);
        }

        .ui-overlay::-webkit-scrollbar {
            width: 4px;
        }
        .ui-overlay::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 2px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: var(--text-warm-white);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-gold);
            border-radius: 50%;
        }

        .minimize-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .minimize-btn:hover {
            color: var(--text-warm-white);
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        button.preset-btn {
            padding: 8px 4px;
            border: 1px solid var(--border-subtle);
            background: var(--btn-gradient);
            color: var(--text-warm-white);
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.preset-btn:hover {
            border-color: var(--border-hover);
            background: var(--btn-hover);
        }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-field label {
            font-size: 10px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .action-link {
            font-size: 9px;
            color: var(--accent-gold);
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .input-field input {
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-warm-white);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        button.apply-btn {
            padding: 8px;
            border: 1px solid var(--accent-gold);
            background: var(--accent-gold-soft);
            color: var(--accent-gold);
            border-radius: 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.apply-btn:hover {
            background: var(--accent-gold);
            color: #060709;
        }

        button.secondary-btn {
            padding: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--btn-gradient);
            color: var(--text-warm-white);
            border-radius: 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.secondary-btn:hover {
            border-color: var(--border-hover);
            background: var(--btn-hover);
        }

        .slider-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-warm-white);
            cursor: pointer;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">
        <span>CONTROLS</span>
    </button>

    <div class="tp-overlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <span style="font-size:8px; opacity:0.6;">(REL ~)</span>
        </div>
        <div class="tp-grid">
            <div class="tp-field">
                <label>X</label>
                <input type="text" id="tpX" placeholder="~">
            </div>
            <div class="tp-field">
                <label>Y</label>
                <input type="text" id="tpY" placeholder="~">
            </div>
            <div class="tp-field">
                <label>Z</label>
                <input type="text" id="tpZ" placeholder="~">
            </div>
        </div>
        
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>

        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT POS</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RELOAD INIT</button>
        </div>

        <div class="tp-coords-display">
            <div id="cameraCoordsDisplay">CUR: X: 0.00 | Y: 0.00 | Z: 0.00</div>
            <div id="initCoordsDisplay" style="color:var(--accent-gold);">INIT: X: 0.00 | Y: 0.00 | Z: 0.00</div>
        </div>
    </div>

    <div class="ui-overlay" id="uiOverlay">
        <header>
            <h1>QUANTUM ORBITAL 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <div>
            <div class="section-title">Presets</div>
            <div class="preset-grid">
                <button class="preset-btn" onclick="loadPreset('C')">Carbon</button>
                <button class="preset-btn" onclick="loadPreset('Fe')">Iron</button>
                <button class="preset-btn" onclick="loadPreset('Mo')">Molybdenum</button>
            </div>
        </div>

        <div>
            <div class="section-title">Quantum Parameters</div>
            <div class="input-card">
                <div class="input-field">
                    <label>Atomic Number (Z)</label>
                    <input type="number" id="inputZ" value="42">
                </div>
                <div class="input-field">
                    <label>Electrons (elec)</label>
                    <input type="text" id="inputElec" value="2, 8, 8, 10, 8, 5, 1">
                </div>
                <div class="input-field">
                    <label>Principal Quantum (n)</label>
                    <input type="text" id="inputN" value="1, 2, 3, 3, 4, 4, 5">
                </div>
                <div class="input-field">
                    <label>Azimuthal Quantum (l)</label>
                    <input type="text" id="inputL" value="0, 1, 1, 2, 1, 2, 0">
                </div>
                <div class="input-field">
                    <div class="input-header">
                        <label>Binding Energy En (eV)</label>
                        <span class="action-link" onclick="autoCalculateEnUI()">[AUTO CALC]</span>
                    </div>
                    <input type="text" id="inputEn" value="" placeholder="Auto-calculated if empty">
                </div>
                <button class="apply-btn" onclick="applyCustomParameters()">UPDATE MODEL</button>
            </div>
        </div>

        <div class="slider-box">
            <div class="section-title">Density Control</div>
            <div class="slider-header">
                <span>Fill Opacity</span>
                <span id="opacityVal" style="color:var(--accent-gold);">35%</span>
            </div>
            <input type="range" id="opacitySlider" min="0.05" max="0.9" step="0.01" value="0.35" oninput="updateOpacity(this.value)">
        </div>

        <div>
            <div class="section-title">Active Orbitals Filter</div>
            <div id="dynamicFilterContainer" class="filter-list"></div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

</body>
</html>
