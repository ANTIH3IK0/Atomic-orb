<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic-orb Beta b1.3-1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Quicksilver Actinium Theme Stylesheet -->
    <link rel="stylesheet" href="quicksilver.css">

    <!-- External UI & Effect APIs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL/scripts/liquidGL.js"></script>

    <!-- 3D Engine & Application Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            transition: filter 0.3s ease;
        }

        body.modal-open #renderCanvas,
        body.modal-open .ui-overlay,
        body.modal-open .tp-overlay,
        body.modal-open .restore-btn,
        body.modal-open .tp-restore-btn {
            filter: blur(12px);
            pointer-events: none;
        }

        .ui-overlay {
            top: 16px;
            left: 16px;
            width: 380px;
            max-height: calc(100vh - 32px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            overflow-y: auto;
        }

        .ui-overlay.collapsed { display: none; }

        .tp-overlay {
            top: 16px;
            right: 16px;
            width: 240px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .tp-overlay.collapsed { display: none; }

        .mode-switch-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
            position: relative;
            z-index: 3;
        }

        .mode-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 6px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .mode-btn:hover { color: var(--text-main); }

        .mode-btn.active {
            background: var(--btn-glass-hover);
            color: var(--text-accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .mode-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mode-container.hidden { display: none !important; }

        .pt-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 3, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .pt-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .pt-modal-window {
            position: relative;
            width: 95vw;
            max-width: 1340px;
            max-height: 92vh;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pt-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            position: relative;
            z-index: 3;
        }

        .pt-modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 3;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important;
        }

        .pt-scroll-area {
            overflow: auto;
            max-height: calc(92vh - 80px);
            padding: 4px;
            position: relative;
            z-index: 3;
        }

        .pt-grid-container {
            display: grid;
            grid-template-columns: 28px repeat(18, minmax(58px, 1fr));
            grid-gap: 4px;
            min-width: 1100px;
        }

        .pt-header-cell, .pt-period-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pt-element-card {
            position: relative;
            height: 56px;
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .pt-element-card:hover {
            background: rgba(30, 41, 59, 0.8) !important;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3) !important;
            z-index: 10;
        }

        .pt-element-card.active {
            background: rgba(15, 23, 42, 0.95) !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5) !important;
        }

        .pt-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .pt-card-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            text-align: center;
            margin-top: 1px;
        }

        .pt-card-name {
            font-size: 8px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .tp-title, .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .tp-grid { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; }
        .tp-field { display: flex; flex-direction: row; align-items: center; gap: 8px; }
        .tp-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; width: 14px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; position: relative; z-index: 3; }

        .restore-btn, .tp-restore-btn {
            position: absolute;
            top: 16px;
            z-index: 9;
            background: var(--panel-glass);
            color: var(--text-sub);
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .restore-btn { left: 16px; }
        .tp-restore-btn { right: 16px; }

        .ui-overlay::-webkit-scrollbar, .pt-scroll-area::-webkit-scrollbar, .orbits-scroll-area::-webkit-scrollbar { width: 4px; height: 4px; }
        .ui-overlay::-webkit-scrollbar-thumb, .pt-scroll-area::-webkit-scrollbar-thumb, .orbits-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }

        header { position: relative; z-index: 3; }

        header h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--text-accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--text-accent);
        }

        .minimize-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.15s ease;
        }

        .minimize-btn:hover { color: var(--text-main); }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            position: relative;
            z-index: 3;
        }

        .input-field { display: flex; flex-direction: column; gap: 4px; }
        .input-header { display: flex; justify-content: space-between; align-items: center; }
        .input-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .action-link { font-size: 9px; color: var(--text-accent); cursor: pointer; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .action-link:hover { opacity: 1; text-decoration: underline; }

        .orbits-scroll-area {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            position: relative;
            z-index: 3;
        }

        .orbit-row {
            display: grid;
            grid-template-columns: 36px 70px 1fr;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
        }

        .orbit-row .ex-input {
            width: 100%;
            text-align: center;
            padding: 4px;
            font-size: 10px;
        }

        .orbit-row .orbit-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
            text-align: center;
        }

        .orbit-row .e-input {
            width: 100%;
            text-align: right;
            padding: 4px 6px;
            font-size: 10px;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: rgba(6, 9, 16, 0.95);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s ease;
            margin: 0;
            display: inline-block;
            vertical-align: middle;
        }

        input[type="checkbox"]:checked {
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -3px;
            left: 2px;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-accent);
        }

        .filter-list { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; }
        .filter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            padding: 6px 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--text-accent);
            cursor: pointer;
            position: relative;
            z-index: 3;
        }
    </style>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <!-- Camera / Teleport Overlay -->
    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <button class="minimize-btn" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="~"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="~"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="~"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RESET</button>
        </div>
    </div>

    <!-- Main UI Panel -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>DIRAC QUANTUM 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <!-- Element Selector via Periodic Table Modal -->
        <div>
            <div class="section-title">Element Selector</div>
            <button class="secondary-btn" style="margin-top:6px;" onclick="openPeriodicTableModal()">PERIODIC TABLE ⊞</button>
        </div>

        <!-- Mode Switcher -->
        <div class="mode-switch-bar">
            <button class="mode-btn active" id="btnModeAuto" onclick="switchControlMode('auto')">AUTO BUILDER</button>
            <button class="mode-btn" id="btnModeManual" onclick="switchControlMode('manual')">MANUAL (r1.1)</button>
        </div>

        <!-- AUTO BUILDER MODE SECTION -->
        <div id="autoModeContainer" class="mode-container">
            <div>
                <div class="section-title">Quantum System Setup</div>
                <div class="input-card" style="margin-top:6px;">
                    <div class="input-field">
                        <label>Atomic Number (Z)</label>
                        <input type="number" id="inputZ" value="6" onchange="rebuildQuantumModel()">
                    </div>

                    <div class="input-field">
                        <label>Max Principal Quantum Number (n)</label>
                        <input type="number" id="inputMaxN" value="2" min="1" max="12" onchange="generateOrbitsBuilder()">
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">
                    <span>Suborbit Configuration</span>
                    <span style="font-size:8px; color:var(--text-muted);">EX | ORBIT | ELEC</span>
                </div>
                
                <div class="orbits-scroll-area" id="orbitsBuilderContainer" style="margin-top:6px;"></div>
            </div>

            <div>
                <div class="input-card">
                    <div class="input-header">
                        <label style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">Binding Energy En (eV)</label>
                        <span class="action-link" onclick="autoCalculateSuborbitEnergiesUI()">[CALC EN]</span>
                    </div>
                    <input type="text" id="inputEn" value="" placeholder="Calculated per split suborbit">
                    <button class="apply-btn" style="margin-top:4px;" onclick="rebuildQuantumModel()">SOLVE DIRAC MODEL</button>
                </div>
            </div>
        </div>

        <!-- MANUAL MODE SECTION (r1.1 Parameters) -->
        <div id="manualModeContainer" class="mode-container hidden">
            <div>
                <div class="section-title">Manual Quantum Parameters</div>
                <div class="input-card" style="margin-top:6px;">
                    <div class="input-field">
                        <label>Atomic Number (Z)</label>
                        <input type="number" id="inputZManual" value="6">
                    </div>
                    <div class="input-field">
                        <label>Elec Config (e.g., 1s2 2s2 2p2)</label>
                        <input type="text" id="inputConfig" value="1s2 2s2 2p2">
                    </div>
                    <div class="input-field">
                        <label>Electrons Array (elec)</label>
                        <input type="text" id="inputElec" value="2, 2, 2">
                    </div>
                    <div class="input-field">
                        <label>Principal Quantum (n)</label>
                        <input type="text" id="inputN" value="1, 2, 2">
                    </div>
                    <div class="input-field">
                        <label>Azimuthal Quantum (l)</label>
                        <input type="text" id="inputL" value="0, 0, 1">
                    </div>
                    <div class="input-field">
                        <div class="input-header">
                            <label>Binding Energy En (eV)</label>
                            <span class="action-link" onclick="autoCalculateEnUI()">[DIRAC CALC]</span>
                        </div>
                        <input type="text" id="inputEnManual" value="" placeholder="Auto-calculated if empty">
                    </div>
                    <button class="apply-btn" style="margin-top:4px;" onclick="rebuildQuantumModel()">RUN DIRAC SOLVER</button>
                </div>
            </div>
        </div>

        <!-- Shared Opacity Slider -->
        <div>
            <div class="section-title">Orbital Opacity</div>
            <input type="range" id="opacitySlider" min="0.05" max="0.9" step="0.01" value="0.35" style="margin-top:6px;" oninput="updateOpacity(this.value)">
        </div>

        <!-- Shared Dirac Filters -->
        <div>
            <div class="section-title">Dirac j-Suborbit Filters</div>
            <div id="dynamicFilterContainer" class="filter-list" style="margin-top:6px;"></div>
        </div>
    </div>

    <!-- Floating Periodic Table Window -->
    <div class="pt-modal-backdrop" id="ptModalBackdrop" onclick="handleBackdropClick(event)">
        <div class="pt-modal-window" id="ptModalWindow">
            <div class="pt-modal-header">
                <div class="pt-modal-title">
                    <span>PERIODIC TABLE</span>
                    <span id="selectedElementTag" style="font-size:10px; color:var(--text-accent); font-weight:normal;">[118 Elements]</span>
                </div>
                <button class="close-btn" onclick="closePeriodicTableModal()">✕</button>
            </div>
            <div class="pt-scroll-area">
                <div class="pt-grid-container" id="ptGridContainer"></div>
            </div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

</body>
</html>
