<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic-orb r1.2 - Obsidian Edition</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="quicksilver.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        body { margin: 0; width: 100vw; height: 100vh; background: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; }

        .ui-overlay { top: 16px; left: 16px; width: 380px; max-height: calc(100vh - 32px); padding: 20px; display: flex; flex-direction: column; gap: 16px; z-index: 10; overflow-y: auto; }
        .tp-overlay { top: 16px; right: 16px; width: 250px; padding: 18px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }

        .mode-switch-bar { display: grid; grid-template-columns: 1fr 1fr; background: var(--input-bg); border-radius: 10px; padding: 3px; gap: 3px; position: relative; z-index: 3; }
        .mode-btn { background: transparent; color: var(--text-muted); padding: 7px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; cursor: pointer; text-align: center; }
        .mode-btn.active { background: var(--btn-glass-hover); color: var(--text-accent); box-shadow: 0 0 14px rgba(56, 189, 248, 0.25); }

        .mode-container { display: flex; flex-direction: column; gap: 14px; }
        .mode-container.hidden { display: none !important; }

        .pt-modal-backdrop { position: fixed; inset: 0; background: rgba(1, 3, 6, 0.9); backdrop-filter: blur(24px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .pt-modal-backdrop.open { opacity: 1; pointer-events: auto; }
        .pt-modal-window { width: 95vw; max-width: 1340px; max-height: 92vh; padding: 24px; display: flex; flex-direction: column; gap: 14px; }

        .tp-title, .section-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 3; }
        .tp-grid { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; }
        .tp-field { display: flex; flex-direction: row; align-items: center; gap: 8px; }
        .tp-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; width: 14px; }

        .input-card { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
        .input-field { display: flex; flex-direction: column; gap: 4px; }
        .input-header { display: flex; justify-content: space-between; align-items: center; }
        .input-field label { font-size: 10px; color: var(--text-sub); font-family: 'JetBrains Mono', monospace; }
        .action-link { font-size: 9px; color: var(--text-accent); cursor: pointer; font-family: 'JetBrains Mono', monospace; }

        .orbits-scroll-area { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; }
        .orbit-row { display: grid; grid-template-columns: 36px 70px 1fr; align-items: center; gap: 8px; padding: 6px 8px; }

        .restore-btn, .tp-restore-btn { position: absolute; top: 16px; z-index: 9; background: var(--panel-glass); color: var(--text-sub); width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .restore-btn { left: 16px; } .tp-restore-btn { right: 16px; }
    </style>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <!-- Camera Overlay -->
    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS</span>
            <button class="secondary-btn" style="width:20px; height:20px; padding:0;" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="0.0"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="0.0"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="0.0"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
    </div>

    <!-- Main Control Overlay -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:3;">
            <h1 style="margin:0; font-family:'JetBrains Mono'; font-size:11px; color:var(--text-main); letter-spacing:1.5px;">DIRAC QUANTUM 3D</h1>
            <button class="secondary-btn" style="width:20px; height:20px; padding:0;" onclick="togglePanel(true)">✕</button>
        </header>

        <div>
            <div class="section-title">Element Selector</div>
            <button class="secondary-btn" style="margin-top:6px; width:100%; padding:8px;" onclick="openPeriodicTableModal()">PERIODIC TABLE ⊞</button>
        </div>

        <div class="mode-switch-bar">
            <button class="mode-btn active" id="btnModeAuto" onclick="switchControlMode('auto')">AUTO BUILDER</button>
            <button class="mode-btn" id="btnModeManual" onclick="switchControlMode('manual')">MANUAL</button>
        </div>

        <div id="autoModeContainer" class="mode-container">
            <div class="input-card">
                <div class="input-field">
                    <label>Atomic Number (Z)</label>
                    <input type="number" id="inputZ" value="6" onchange="rebuildQuantumModel()">
                </div>
                <div class="input-field">
                    <label>Max Principal Quantum (n)</label>
                    <input type="number" id="inputMaxN" value="2" min="1" max="12" onchange="generateOrbitsBuilder()">
                </div>
            </div>

            <div class="section-title">Suborbit Configuration</div>
            <div class="orbits-scroll-area" id="orbitsBuilderContainer"></div>

            <div class="input-card">
                <div class="input-header">
                    <label>Binding Energy En (eV)</label>
                    <span class="action-link" onclick="autoCalculateSuborbitEnergiesUI()">[CALC EN]</span>
                </div>
                <input type="text" id="inputEn" value="" placeholder="Calculated per suborbit">
                <button class="apply-btn" onclick="rebuildQuantumModel()">SOLVE DIRAC MODEL</button>
            </div>
        </div>

        <div>
            <div class="section-title">Orbital Opacity</div>
            <input type="range" id="opacitySlider" min="0.05" max="0.9" step="0.01" value="0.35" style="margin-top:6px;" oninput="updateOpacity(this.value)">
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

</body>
</html>
