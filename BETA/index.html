<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic-orb b1.3-2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="effects.css">

    <!-- External APIs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL/scripts/liquidGL.js"></script>

    <!-- 3D Engine & Application Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <!-- 3D Babylon Rendering Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- Camera Navigation Overlay -->
    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <button class="minimize-btn" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="~"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="~"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="~"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RESET</button>
        </div>
    </div>

    <!-- Control Overlay -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>DIRAC QUANTUM 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <div class="mode-switch-bar">
            <button id="btnModeAuto" class="mode-btn active" onclick="switchControlMode('auto')">PERIODIC</button>
            <button id="btnModeManual" class="mode-btn" onclick="switchControlMode('manual')">MANUAL</button>
        </div>

        <div id="autoModeContainer" class="mode-container">
            <div class="input-card">
                <div class="input-header">
                    <span class="section-title">ELEMENT SELECTION</span>
                    <span id="selectedElementTag" class="action-link" onclick="openPeriodicTableModal()">[Z = 6 Carbon]</span>
                </div>
                <button class="apply-btn" onclick="openPeriodicTableModal()">OPEN PERIODIC TABLE</button>
            </div>
        </div>

        <div id="manualModeContainer" class="mode-container hidden">
            <div class="input-card">
                <div class="input-field">
                    <label for="inputZ">ATOMIC NUMBER (Z)</label>
                    <input type="number" id="inputZ" value="6" min="1" max="172">
                </div>
                <div class="input-field">
                    <label for="inputMaxN">MAX PRINCIPAL QUANTUM NUMBER (n)</label>
                    <input type="number" id="inputMaxN" value="2" min="1" max="24" onchange="generateOrbitsBuilder(true)">
                </div>
            </div>

            <div class="section-title">ORBITAL CONFIGURATION</div>
            <div class="orbits-scroll-area" id="orbitsBuilderContainer"></div>

            <button class="apply-btn" onclick="autoCalculateSuborbitEnergiesUI(); rebuildQuantumModel();">UPDATE QUANTUM MODEL</button>
        </div>

        <div class="input-card">
            <div class="section-title">ORBITAL ENERGIES</div>
            <input type="text" id="inputEn" readonly placeholder="Energies will compute here...">
        </div>

        <div class="input-card">
            <div class="section-title">OPACITY CONTROL</div>
            <input type="range" id="opacityRange" min="0.05" max="1.0" step="0.05" value="0.35" oninput="updateOpacity(this.value)">
        </div>

        <div class="section-title">VISIBILITY FILTERS</div>
        <div class="filter-list" id="dynamicFilterContainer"></div>
    </div>

    <!-- Periodic Table Modal -->
    <div class="pt-modal-backdrop" id="ptModalBackdrop" onclick="handleBackdropClick(event)">
        <div class="pt-modal-window">
            <div class="pt-modal-header">
                <div class="pt-modal-title">PERIODIC TABLE OF ELEMENTS</div>
                <button class="close-btn" onclick="closePeriodicTableModal()">✕</button>
            </div>
            <div class="pt-scroll-area">
                <div class="pt-grid-container" id="ptGridContainer"></div>
            </div>
        </div>
    </div>

</body>
</html>
