<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dirac Quantum Suborbital Visualizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>

    <style>
        :root {
            --bg-dark: #05070a;
            
            /* Dark Liquid Glass Palette */
            --panel-glass: rgba(13, 17, 26, 0.55);
            --card-glass: rgba(255, 255, 255, 0.02);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-glass-active: rgba(148, 163, 184, 0.25);
            
            --input-bg: rgba(7, 10, 16, 0.6);
            --btn-glass: rgba(255, 255, 255, 0.03);
            --btn-glass-hover: rgba(255, 255, 255, 0.07);

            /* Off-White Grey-Blue Typography */
            --text-main: #e2e8f0;
            --text-sub: #cbd5e1;
            --text-muted: #64748b;
            --text-accent: #93c5fd;
            --accent-glow: rgba(147, 197, 253, 0.1);

            --chk-bg: rgba(10, 14, 22, 0.8);
            --chk-border: rgba(255, 255, 255, 0.1);
            --chk-checked-bg: rgba(30, 41, 59, 0.85);
            --chk-tick-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #0d121d 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }

        /* Dark Liquid Glass Panels */
        .ui-overlay, .template-overlay, .tp-overlay {
            position: absolute;
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(32px) saturate(150%);
            -webkit-backdrop-filter: blur(32px) saturate(150%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            overflow: hidden;
        }

        /* Dynamic Mouse Sheen Effect Overlay */
        .ui-overlay::before, .template-overlay::before, .tp-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.04), 
                transparent 70%
            );
            pointer-events: none;
            z-index: 1;
        }

        .ui-overlay {
            top: 16px;
            left: 16px;
            width: 400px;
            max-height: calc(100vh - 32px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            overflow-y: auto;
        }

        .ui-overlay.collapsed {
            transform: translateX(-440px) !important;
            opacity: 0;
            pointer-events: none;
        }

        .template-overlay {
            top: 16px;
            left: 432px;
            width: 310px;
            max-height: calc(100vh - 32px);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 11;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-15px);
        }

        .template-overlay.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            overflow-y: auto;
            max-height: 480px;
            padding-right: 2px;
        }

        .template-card-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--btn-glass);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .template-card-btn:hover {
            border-color: var(--border-glass-active);
            background: var(--btn-glass-hover);
        }

        .template-card-btn.active {
            border-color: var(--text-accent);
            background: var(--accent-glow);
        }

        .template-card-btn .symbol {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-accent);
            width: 28px;
        }

        .tp-overlay {
            top: 16px;
            right: 16px;
            width: 250px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .tp-overlay.collapsed {
            transform: translateX(290px) !important;
            opacity: 0;
            pointer-events: none;
        }

        .tp-title, .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tp-grid { display: flex; flex-direction: column; gap: 6px; }
        .tp-field { display: flex; flex-direction: row; align-items: center; gap: 8px; }
        .tp-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; width: 14px; }
        
        input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--border-glass-active);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .restore-btn, .tp-restore-btn {
            position: absolute;
            top: 16px;
            z-index: 9;
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .restore-btn { left: 16px; }
        .tp-restore-btn { right: 16px; }

        .ui-overlay::-webkit-scrollbar, .template-grid::-webkit-scrollbar, .orbits-scroll-area::-webkit-scrollbar { width: 4px; }
        .ui-overlay::-webkit-scrollbar-thumb, .template-grid::-webkit-scrollbar-thumb, .orbits-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 2px; }

        header h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--text-accent);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.3);
        }

        .minimize-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .minimize-btn:hover { color: var(--text-main); }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--card-glass);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
        }

        .input-field { display: flex; flex-direction: column; gap: 4px; }
        .input-header { display: flex; justify-content: space-between; align-items: center; }
        .input-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .action-link { font-size: 9px; color: var(--text-accent); cursor: pointer; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .action-link:hover { opacity: 1; text-decoration: underline; }

        button.apply-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-glass-active);
            background: var(--accent-glow);
            color: var(--text-accent);
            border-radius: 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.apply-btn:hover {
            background: rgba(147, 197, 253, 0.2);
            color: var(--text-main);
            box-shadow: 0 0 12px rgba(147, 197, 253, 0.15);
        }

        button.secondary-btn {
            padding: 8px;
            border: 1px solid var(--border-glass);
            background: var(--btn-glass);
            color: var(--text-sub);
            border-radius: 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button.secondary-btn:hover {
            border-color: var(--border-glass-active);
            background: var(--btn-glass-hover);
            color: var(--text-main);
        }

        /* Suborbit Builder Grid */
        .orbits-scroll-area {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .orbit-row {
            display: grid;
            grid-template-columns: 46px 80px 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        .orbit-row .ex-input {
            width: 100%;
            text-align: center;
            padding: 3px;
            font-size: 10px;
        }

        .orbit-row .orbit-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .orbit-row .e-input {
            width: 100%;
            text-align: right;
            padding: 3px 6px;
            font-size: 10px;
        }

        /* Dark Liquid Checkbox */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--chk-bg);
            border: 1px solid var(--chk-border);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="checkbox"]:checked {
            background: var(--chk-checked-bg);
            border-color: var(--chk-tick-color);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -3px;
            left: 2px;
            font-size: 10px;
            font-weight: bold;
            color: var(--chk-tick-color);
        }

        .filter-list { display: flex; flex-direction: column; gap: 6px; }
        .filter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            background: var(--card-glass);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--text-sub);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <button class="minimize-btn" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="~"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="~"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="~"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RESET</button>
        </div>
    </div>

    <!-- Main UI Panel -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>DIRAC QUANTUM 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <div>
            <div class="section-title">Element Presets</div>
            <button class="secondary-btn" style="margin-top:6px;" onclick="toggleTemplatePanel()">SELECT ELEMENT PRESET ⊞</button>
        </div>

        <div>
            <div class="section-title">Quantum System Setup</div>
            <div class="input-card" style="margin-top:6px;">
                <div class="input-field">
                    <label>Atomic Number (Z)</label>
                    <input type="number" id="inputZ" value="6" onchange="rebuildQuantumModel()">
                </div>

                <div class="input-field">
                    <label>Max Principal Quantum Number (n)</label>
                    <input type="number" id="inputMaxN" value="2" min="1" max="12" onchange="generateOrbitsBuilder()">
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">
                <span>Suborbit Configuration</span>
                <span style="font-size:8px; color:var(--text-muted);">EX | ORBIT | ELEC</span>
            </div>
            
            <div class="orbits-scroll-area" id="orbitsBuilderContainer" style="margin-top:6px;">
                <!-- Dynamically populated suborbit rows -->
            </div>
        </div>

        <div>
            <div class="input-card">
                <div class="input-header">
                    <label style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">Binding Energy En (eV)</label>
                    <span class="action-link" onclick="autoCalculateSuborbitEnergiesUI()">[CALC EN]</span>
                </div>
                <input type="text" id="inputEn" value="" placeholder="Calculated per split suborbit">
                <button class="apply-btn" style="margin-top:4px;" onclick="rebuildQuantumModel()">SOLVE DIRAC MODEL</button>
            </div>
        </div>

        <div>
            <div class="section-title">Orbital Opacity</div>
            <input type="range" id="opacitySlider" min="0.05" max="0.9" step="0.01" value="0.35" style="margin-top:6px;" oninput="updateOpacity(this.value)">
        </div>

        <div>
            <div class="section-title">Dirac j-Suborbit Filters</div>
            <div id="dynamicFilterContainer" class="filter-list" style="margin-top:6px;"></div>
        </div>
    </div>

    <!-- Secondary Template Panel -->
    <div class="template-overlay" id="templateOverlay">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="section-title">ELEMENT PRESETS</span>
            <button class="minimize-btn" onclick="toggleTemplatePanel(false)">✕</button>
        </div>
        <div class="template-grid" id="templateGridContainer"></div>
    </div>

    <canvas id="renderCanvas"></canvas>

</body>
</html>
