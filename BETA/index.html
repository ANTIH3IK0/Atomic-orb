<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic-orb Beta b1.25-4-semifinal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="effects.css">

    <!-- Embedded CSS for folding functionality -->
    <style>
        .collapsible-content.collapsed {
            display: none !important;
        }
    </style>

    <!-- External UI & Effect APIs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL/scripts/liquidGL.js"></script>

    <!-- 3D Engine & Application Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <!-- Camera / Teleport Overlay -->
    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <button class="minimize-btn" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="~"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="~"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="~"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RESET</button>
        </div>
    </div>

    <!-- Main UI Panel -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>DIRAC QUANTUM 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <!-- Element Selector via Periodic Table Modal -->
        <div>
            <div class="section-title">Element Selector</div>
            <button class="secondary-btn" style="margin-top:6px;" onclick="openPeriodicTableModal()">PERIODIC TABLE ⊞</button>
        </div>

        <!-- Mode Switcher -->
        <div class="mode-switch-bar">
            <button class="mode-btn active" id="btnModeAuto" onclick="switchControlMode('auto')">AUTO BUILDER</button>
            <button class="mode-btn" id="btnModeManual" onclick="switchControlMode('manual')">MANUAL (r1.1)</button>
        </div>

        <!-- AUTO BUILDER MODE SECTION -->
        <div id="autoModeContainer" class="mode-container">
            <!-- 1. Collapsible: QUANTUM SYSTEM SETUP (Default: Collapsed) -->
            <div class="collapsible-section">
                <div class="section-title" style="cursor:pointer;" onclick="toggleSection('quantumSetupContent', this.querySelector('.collapse-btn'))">
                    <span>Quantum System Setup</span>
                    <button class="minimize-btn collapse-btn" type="button" onclick="event.stopPropagation(); toggleSection('quantumSetupContent', this)">+</button>
                </div>
                <div id="quantumSetupContent" class="collapsible-content collapsed">
                    <div class="input-card" style="margin-top:6px;">
                        <div class="input-field">
                            <label>Atomic Number (Z)</label>
                            <input type="number" id="inputZ" value="6" onchange="rebuildQuantumModel()">
                        </div>

                        <div class="input-field">
                            <label>Max Principal Quantum Number (n)</label>
                            <input type="number" id="inputMaxN" value="2" min="1" max="12" onchange="generateOrbitsBuilder()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Collapsible: SUBORBIT CONFIGURATION (Default: Collapsed) -->
            <div class="collapsible-section" style="margin-top:10px;">
                <div class="section-title" style="cursor:pointer;" onclick="toggleSection('suborbitConfigContent', this.querySelector('.collapse-btn'))">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>Suborbit Configuration</span>
                        <span style="font-size:8px; color:var(--text-muted);">EX | ORBIT | ELEC</span>
                    </div>
                    <button class="minimize-btn collapse-btn" type="button" onclick="event.stopPropagation(); toggleSection('suborbitConfigContent', this)">+</button>
                </div>
                
                <div id="suborbitConfigContent" class="collapsible-content collapsed">
                    <div class="orbits-scroll-area" id="orbitsBuilderContainer" style="margin-top:6px;"></div>

                    <div style="margin-top:6px;">
                        <div class="input-card">
                            <div class="input-header">
                                <label style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">Binding Energy En (eV)</label>
                                <span class="action-link" onclick="autoCalculateSuborbitEnergiesUI()">[CALC EN]</span>
                            </div>
                            <input type="text" id="inputEn" value="" placeholder="Calculated per split suborbit">
                            <button class="apply-btn" style="margin-top:4px;" onclick="rebuildQuantumModel()">SOLVE DIRAC MODEL</button>
                        </div>
                    </div>

                    <!-- 3. Nested Collapsible: ORBITAL VISIBILITY FILTERS (Default: Collapsed) -->
                    <div class="collapsible-section" style="margin-top:10px;">
                        <div class="section-title" style="cursor:pointer;" onclick="toggleSection('visibilityFiltersContent', this.querySelector('.collapse-btn'))">
                            <span>Orbital Visibility Filters</span>
                            <button class="minimize-btn collapse-btn" type="button" onclick="event.stopPropagation(); toggleSection('visibilityFiltersContent', this)">+</button>
                        </div>
                        <div id="visibilityFiltersContent" class="collapsible-content collapsed">
                            <div class="filter-list" id="dynamicFilterContainer" style="margin-top:6px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MANUAL MODE SECTION (r1.1 Parameters) -->
        <div id="manualModeContainer" class="mode-container hidden">
            <div>
                <div class="section-title">Manual Quantum Parameters</div>
                <div class="input-card" style="margin-top:6px;">
                    <div class="input-field">
                        <label>Atomic Number (Z)</label>
                        <input type="number" id="inputZManual" value="6">
                    </div>
                    <div class="input-field">
                        <label>Elec Config (e.g., 1s2 2s2 2p2)</label>
                        <input type="text" id="inputConfig" value="1s2 2s2 2p2" oninput="if(typeof onConfigInputChanged === 'function') onConfigInputChanged();">
                    </div>
                    <div class="input-field">
                        <label>Electrons Array (elec)</label>
                        <input type="text" id="inputElec" value="2, 2, 2">
                    </div>
                    <div class="input-field">
                        <label>Principal Quantum (n)</label>
                        <input type="text" id="inputN" value="1, 2, 2">
                    </div>
                    <div class="input-field">
                        <label>Azimuthal Quantum (l)</label>
                        <input type="text" id="inputL" value="0, 0, 1">
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">Global Mesh Opacity</div>
            <input type="range" id="opacityRange" min="0.05" max="1.0" step="0.05" value="0.35" oninput="updateOpacity(this.value)" style="margin-top:6px;">
        </div>
    </div>

    <!-- Periodic Table Modal Backdrop -->
    <div class="pt-modal-backdrop" id="ptModalBackdrop" onclick="handleBackdropClick(event)">
        <div class="pt-modal-window">
            <div class="pt-modal-header">
                <div class="pt-modal-title">
                    <span>PERIODIC TABLE SELECTOR</span>
                    <span id="selectedElementTag" style="color:var(--text-accent); font-size:11px;"></span>
                </div>
                <button class="close-btn" onclick="closePeriodicTableModal()">✕</button>
            </div>
            <div class="pt-scroll-area">
                <div class="pt-grid-container" id="ptGridContainer"></div>
            </div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        function toggleSection(targetId, btn) {
            const target = document.getElementById(targetId);
            if (!target) return;
            const isCollapsed = target.classList.toggle('collapsed');
            if (btn) {
                btn.textContent = isCollapsed ? '+' : '−';
            }
            if (typeof refreshAllLiquid === 'function') {
                requestAnimationFrame(() => refreshAllLiquid());
            }
        }
    </script>
</body>
</html>
