<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic-orb Beta b1.2-72</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- External UI & Effect APIs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL/scripts/liquidGL.js"></script>

    <!-- 3D Engine & Application Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>

    <style>
        :root {
            --bg-dark: #030508;
            
            /* High-Density Dark Smoked Glass Palette */
            --panel-glass: rgba(10, 14, 22, 0.72);
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.12);
            --border-glass-active: rgba(147, 197, 253, 0.4);
            
            --input-bg: rgba(6, 9, 15, 0.85);
            --btn-glass: rgba(255, 255, 255, 0.05);
            --btn-glass-hover: rgba(255, 255, 255, 0.12);

            /* Off-White Grey-Blue Typography */
            --text-main: #e2e8f0;
            --text-sub: #cbd5e1;
            --text-muted: #64748b;
            --text-accent: #93c5fd;
            --accent-glow: rgba(147, 197, 253, 0.15);

            --chk-bg: rgba(8, 12, 18, 0.9);
            --chk-border: rgba(255, 255, 255, 0.15);
            --chk-checked-bg: rgba(30, 41, 59, 0.95);
            --chk-tick-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #080c16 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            transition: filter 0.3s ease;
        }

        /* Blur target when modal is active */
        body.modal-open #renderCanvas,
        body.modal-open .ui-overlay,
        body.modal-open .tp-overlay,
        body.modal-open .restore-btn,
        body.modal-open .tp-restore-btn {
            filter: blur(12px);
            pointer-events: none;
        }

        /* Frosted Smoked Glass Panels with Refractive Edge Lighting */
        .ui-overlay, .tp-overlay, .pt-modal-window {
            position: absolute;
            background: linear-gradient(
                140deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(12, 16, 26, 0.75) 40%,
                rgba(6, 9, 15, 0.88) 100%
            );
            border: 1px solid var(--border-glass);
            border-top: 1.5px solid rgba(255, 255, 255, 0.35);
            border-left: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.3),
                inset 0 -8px 16px rgba(0, 0, 0, 0.5),
                0 30px 60px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(32px) saturate(200%) contrast(105%);
            -webkit-backdrop-filter: blur(32px) saturate(200%) contrast(105%);
            will-change: transform, opacity;
            overflow: hidden;
        }

        /* Soft Dynamic Pointer Light Source */
        .ui-overlay::before, .tp-overlay::before, .pt-modal-window::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.06), 
                transparent 70%
            );
            pointer-events: none;
            z-index: 1;
        }

        .ui-overlay {
            top: 16px;
            left: 16px;
            width: 390px;
            max-height: calc(100vh - 32px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            overflow-y: auto;
        }

        .ui-overlay.collapsed { display: none; }

        .tp-overlay {
            top: 16px;
            right: 16px;
            width: 250px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .tp-overlay.collapsed { display: none; }

        /* Floating Periodic Table Modal Overlay */
        .pt-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 5, 8, 0.8);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .pt-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .pt-modal-window {
            position: relative;
            width: 95vw;
            max-width: 1340px;
            max-height: 92vh;
            border-radius: 22px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .pt-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-glass);
            position: relative;
            z-index: 3;
        }

        .pt-modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s ease;
            position: relative;
            z-index: 3;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        /* Periodic Table Grid Layout */
        .pt-scroll-area {
            overflow: auto;
            max-height: calc(92vh - 80px);
            padding: 6px;
            position: relative;
            z-index: 3;
        }

        .pt-grid-container {
            display: grid;
            grid-template-columns: 28px repeat(18, minmax(58px, 1fr));
            grid-gap: 5px;
            min-width: 1100px;
        }

        .pt-header-cell, .pt-period-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Frosted Glass Element Tiles */
        .pt-element-card {
            position: relative;
            height: 58px;
            padding: 4px 6px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
            overflow: hidden;

            /* Frosted Dark Glass Tile Texture */
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(15, 21, 32, 0.6) 100%
            );
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);

            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid var(--group-border, rgba(255, 255, 255, 0.15));
            border-bottom: 1px solid var(--group-border, rgba(255, 255, 255, 0.15));

            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 -2px 4px rgba(0, 0, 0, 0.3),
                0 4px 12px rgba(0, 0, 0, 0.5);
        }

        .pt-element-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-color: var(--group-color, rgba(255, 255, 255, 0.03));
            z-index: 0;
            pointer-events: none;
        }

        .pt-element-card > * {
            position: relative;
            z-index: 1;
        }

        .pt-element-card:hover {
            transform: translateY(-3px) scale(1.06);
            z-index: 20;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.2) 0%,
                rgba(22, 30, 46, 0.8) 100%
            );
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                0 10px 22px rgba(0, 0, 0, 0.75),
                0 0 14px var(--group-border, rgba(255, 255, 255, 0.3));
        }

        .pt-element-card.active {
            border-color: rgba(255, 255, 255, 0.8) !important;
            box-shadow: 
                inset 0 1px 3px rgba(255, 255, 255, 0.8),
                0 0 18px rgba(147, 197, 253, 0.5);
            transform: scale(1.04);
            z-index: 15;
        }

        /* DARK GROUPS */
        .pt-element-card[data-group="1"]  { --group-color: hsla(25, 40%, 15%, 0.35); --group-border: hsla(25, 45%, 30%, 0.5); }
        .pt-element-card[data-group="2"]  { --group-color: hsla(30, 38%, 15%, 0.35); --group-border: hsla(30, 42%, 30%, 0.5); }
        .pt-element-card[data-group="3"]  { --group-color: hsla(35, 35%, 15%, 0.35); --group-border: hsla(35, 38%, 30%, 0.5); }
        .pt-element-card[data-group="4"]  { --group-color: hsla(40, 32%, 15%, 0.35); --group-border: hsla(40, 35%, 30%, 0.5); }
        .pt-element-card[data-group="5"]  { --group-color: hsla(45, 30%, 15%, 0.35); --group-border: hsla(45, 30%, 30%, 0.5); }
        .pt-element-card[data-group="6"]  { --group-color: hsla(50, 28%, 15%, 0.35); --group-border: hsla(50, 28%, 30%, 0.5); }
        .pt-element-card[data-group="7"]  { --group-color: hsla(60, 22%, 15%, 0.35); --group-border: hsla(60, 22%, 30%, 0.5); }
        .pt-element-card[data-group="8"]  { --group-color: hsla(75, 15%, 15%, 0.35); --group-border: hsla(75, 15%, 30%, 0.5); }
        .pt-element-card[data-group="9"]  { --group-color: hsla(110, 8%, 16%, 0.35); --group-border: hsla(110, 8%, 30%, 0.5); }
        .pt-element-card[data-group="10"] { --group-color: hsla(150, 8%, 16%, 0.35); --group-border: hsla(150, 8%, 30%, 0.5); }
        .pt-element-card[data-group="11"] { --group-color: hsla(180, 10%, 16%, 0.35); --group-border: hsla(180, 10%, 30%, 0.5); }
        .pt-element-card[data-group="12"] { --group-color: hsla(190, 14%, 16%, 0.35); --group-border: hsla(190, 15%, 30%, 0.5); }
        .pt-element-card[data-group="13"] { --group-color: hsla(195, 18%, 16%, 0.35); --group-border: hsla(195, 20%, 30%, 0.5); }
        .pt-element-card[data-group="14"] { --group-color: hsla(200, 22%, 17%, 0.35); --group-border: hsla(200, 24%, 31%, 0.5); }
        .pt-element-card[data-group="15"] { --group-color: hsla(205, 25%, 17%, 0.35); --group-border: hsla(205, 28%, 31%, 0.5); }
        .pt-element-card[data-group="16"] { --group-color: hsla(210, 28%, 17%, 0.35); --group-border: hsla(210, 30%, 32%, 0.5); }
        .pt-element-card[data-group="17"] { --group-color: hsla(215, 32%, 18%, 0.35); --group-border: hsla(215, 34%, 33%, 0.5); }
        .pt-element-card[data-group="18"] { --group-color: hsla(220, 10%, 12%, 0.6); --group-border: hsla(220, 8%, 24%, 0.4); }

        .pt-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            color: var(--text-sub);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .pt-card-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            color: #ffffff;
            text-align: center;
            margin-top: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        .pt-card-name {
            font-size: 8px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .tp-title, .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .tp-grid { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; }
        .tp-field { display: flex; flex-direction: row; align-items: center; gap: 8px; }
        .tp-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; width: 14px; }
        
        input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--border-glass-active);
            box-shadow: 0 0 10px rgba(147, 197, 253, 0.15);
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; position: relative; z-index: 3; }

        .restore-btn, .tp-restore-btn {
            position: absolute;
            top: 16px;
            z-index: 9;
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .restore-btn:hover, .tp-restore-btn:hover {
            border-color: var(--border-glass-active);
            color: var(--text-main);
        }

        .restore-btn { left: 16px; }
        .tp-restore-btn { right: 16px; }

        .ui-overlay::-webkit-scrollbar, .pt-scroll-area::-webkit-scrollbar, .orbits-scroll-area::-webkit-scrollbar { width: 4px; height: 4px; }
        .ui-overlay::-webkit-scrollbar-thumb, .pt-scroll-area::-webkit-scrollbar-thumb, .orbits-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 2px; }

        header { position: relative; z-index: 3; }

        header h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--text-accent);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.4);
        }

        .minimize-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .minimize-btn:hover { color: var(--text-main); }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--card-glass);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            position: relative;
            z-index: 3;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .input-field { display: flex; flex-direction: column; gap: 4px; }
        .input-header { display: flex; justify-content: space-between; align-items: center; }
        .input-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .action-link { font-size: 9px; color: var(--text-accent); cursor: pointer; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .action-link:hover { opacity: 1; text-decoration: underline; }

        /* Frosted Glass Action Buttons */
        button.apply-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-glass-active);
            background: var(--accent-glow);
            color: var(--text-accent);
            border-radius: 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            z-index: 3;
        }

        button.apply-btn:hover {
            background: rgba(147, 197, 253, 0.25);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(147, 197, 253, 0.25);
        }

        button.secondary-btn {
            padding: 8px;
            border: 1px solid var(--border-glass);
            background: var(--btn-glass);
            color: var(--text-sub);
            border-radius: 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: border-color 0.2s ease, background 0.2s ease;
            width: 100%;
            position: relative;
            z-index: 3;
        }

        button.secondary-btn:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: var(--btn-glass-hover);
            color: var(--text-main);
        }

        .orbits-scroll-area {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            position: relative;
            z-index: 3;
        }

        .orbit-row {
            display: grid;
            grid-template-columns: 46px 80px 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .orbit-row .ex-input {
            width: 100%;
            text-align: center;
            padding: 3px;
            font-size: 10px;
        }

        .orbit-row .orbit-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .orbit-row .e-input {
            width: 100%;
            text-align: right;
            padding: 3px 6px;
            font-size: 10px;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--chk-bg);
            border: 1px solid var(--chk-border);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: background 0.2s ease;
        }

        input[type="checkbox"]:checked {
            background: var(--chk-checked-bg);
            border-color: var(--chk-tick-color);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -3px;
            left: 2px;
            font-size: 10px;
            font-weight: bold;
            color: var(--chk-tick-color);
        }

        .filter-list { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 3; }
        .filter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            background: var(--card-glass);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--text-sub);
            cursor: pointer;
            position: relative;
            z-index: 3;
        }
    </style>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <button class="minimize-btn" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="~"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="~"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="~"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RESET</button>
        </div>
    </div>

    <!-- Main UI Panel -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>DIRAC QUANTUM 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <div>
            <div class="section-title">Element Selector</div>
            <button class="secondary-btn" style="margin-top:6px;" onclick="openPeriodicTableModal()">PERIODIC TABLE ⊞</button>
        </div>

        <div>
            <div class="section-title">Quantum System Setup</div>
            <div class="input-card" style="margin-top:6px;">
                <div class="input-field">
                    <label>Atomic Number (Z)</label>
                    <input type="number" id="inputZ" value="6" onchange="rebuildQuantumModel()">
                </div>

                <div class="input-field">
                    <label>Max Principal Quantum Number (n)</label>
                    <input type="number" id="inputMaxN" value="2" min="1" max="12" onchange="generateOrbitsBuilder()">
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">
                <span>Suborbit Configuration</span>
                <span style="font-size:8px; color:var(--text-muted);">EX | ORBIT | ELEC</span>
            </div>
            
            <div class="orbits-scroll-area" id="orbitsBuilderContainer" style="margin-top:6px;"></div>
        </div>

        <div>
            <div class="input-card">
                <div class="input-header">
                    <label style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">Binding Energy En (eV)</label>
                    <span class="action-link" onclick="autoCalculateSuborbitEnergiesUI()">[CALC EN]</span>
                </div>
                <input type="text" id="inputEn" value="" placeholder="Calculated per split suborbit">
                <button class="apply-btn" style="margin-top:4px;" onclick="rebuildQuantumModel()">SOLVE DIRAC MODEL</button>
            </div>
        </div>

        <div>
            <div class="section-title">Orbital Opacity</div>
            <input type="range" id="opacitySlider" min="0.05" max="0.9" step="0.01" value="0.35" style="margin-top:6px;" oninput="updateOpacity(this.value)">
        </div>

        <div>
            <div class="section-title">Dirac j-Suborbit Filters</div>
            <div id="dynamicFilterContainer" class="filter-list" style="margin-top:6px;"></div>
        </div>
    </div>

    <!-- Floating Periodic Table Window -->
    <div class="pt-modal-backdrop" id="ptModalBackdrop" onclick="handleBackdropClick(event)">
        <div class="pt-modal-window" id="ptModalWindow">
            <div class="pt-modal-header">
                <div class="pt-modal-title">
                    <span>PERIODIC TABLE</span>
                    <span id="selectedElementTag" style="font-size:10px; color:var(--text-accent); font-weight:normal;">[118 Elements]</span>
                </div>
                <button class="close-btn" onclick="closePeriodicTableModal()">✕</button>
            </div>
            <div class="pt-scroll-area">
                <div class="pt-grid-container" id="ptGridContainer"></div>
            </div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

</body>
</html>
