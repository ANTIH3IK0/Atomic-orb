<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atomic-orb Beta b1.2-5</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- External UI & Effect APIs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL/scripts/liquidGL.js"></script>

    <!-- 3D Engine & Application Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="effects.js" defer></script>
    <script src="kernel.js" defer></script>

    <style>
        :root {
            --bg-dark: #05070a;
            
            /* Dark Liquid Glass Palette */
            --panel-glass: rgba(13, 17, 26, 0.45);
            --card-glass: rgba(255, 255, 255, 0.02);
            --border-glass: rgba(255, 255, 255, 0.07);
            --border-glass-active: rgba(147, 197, 253, 0.3);
            
            --input-bg: rgba(7, 10, 16, 0.65);
            --btn-glass: rgba(255, 255, 255, 0.03);
            --btn-glass-hover: rgba(255, 255, 255, 0.08);

            /* Off-White Grey-Blue Typography */
            --text-main: #e2e8f0;
            --text-sub: #cbd5e1;
            --text-muted: #64748b;
            --text-accent: #93c5fd;
            --accent-glow: rgba(147, 197, 253, 0.12);

            --chk-bg: rgba(10, 14, 22, 0.85);
            --chk-border: rgba(255, 255, 255, 0.1);
            --chk-checked-bg: rgba(30, 41, 59, 0.9);
            --chk-tick-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #0d121d 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            transition: filter 0.3s ease;
        }

        /* Blur target when modal is active */
        body.modal-open #renderCanvas,
        body.modal-open .ui-overlay,
        body.modal-open .tp-overlay,
        body.modal-open .restore-btn,
        body.modal-open .tp-restore-btn {
            filter: blur(8px);
            pointer-events: none;
        }

        /* Liquid Glass Panels */
        .ui-overlay, .tp-overlay {
            position: absolute;
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(32px) saturate(160%);
            -webkit-backdrop-filter: blur(32px) saturate(160%);
            will-change: transform, opacity;
            overflow: hidden;
        }

        .ui-overlay::before, .tp-overlay::before, .pt-modal-window::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.05), 
                transparent 70%
            );
            pointer-events: none;
            z-index: 1;
        }

        .ui-overlay {
            top: 16px;
            left: 16px;
            width: 400px;
            max-height: calc(100vh - 32px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            overflow-y: auto;
        }

        .ui-overlay.collapsed { display: none; }

        .tp-overlay {
            top: 16px;
            right: 16px;
            width: 250px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .tp-overlay.collapsed { display: none; }

        /* Floating Periodic Table Modal Overlay */
        .pt-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 7, 12, 0.65);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .pt-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .pt-modal-window {
            position: relative;
            width: 95vw;
            max-width: 1320px;
            max-height: 92vh;
            background: rgba(10, 14, 23, 0.85);
            border: 1px solid var(--border-glass-active);
            border-radius: 20px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .pt-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-glass);
        }

        .pt-modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        /* Periodic Table Grid Layout */
        .pt-scroll-area {
            overflow: auto;
            max-height: calc(92vh - 80px);
            padding: 8px;
        }

        .pt-grid-container {
            display: grid;
            grid-template-columns: 28px repeat(18, minmax(58px, 1fr));
            grid-gap: 4px;
            min-width: 1100px;
        }

        .pt-header-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 0;
        }

        .pt-period-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pt-element-card {
            background: var(--btn-glass);
            border: 1px solid var(--border-glass);
            border-radius: 6px;
            padding: 4px;
            height: 56px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .pt-element-card:hover {
            border-color: var(--text-accent);
            background: var(--accent-glow);
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
        }

        .pt-element-card.active {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.25);
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
        }

        .pt-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .pt-card-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-main);
            text-align: center;
            margin-top: 1px;
        }

        .pt-card-name {
            font-size: 8px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* Category Color Indicators */
        .pt-element-card[data-cat="reactive-nonmetal"] { border-left: 3px solid #60a5fa; }
        .pt-element-card[data-cat="noble-gas"] { border-left: 3px solid #c084fc; }
        .pt-element-card[data-cat="alkali-metal"] { border-left: 3px solid #f87171; }
        .pt-element-card[data-cat="alkaline-earth"] { border-left: 3px solid #fb923c; }
        .pt-element-card[data-cat="metalloid"] { border-left: 3px solid #34d399; }
        .pt-element-card[data-cat="post-transition"] { border-left: 3px solid #a3e635; }
        .pt-element-card[data-cat="transition-metal"] { border-left: 3px solid #facc15; }
        .pt-element-card[data-cat="lanthanide"] { border-left: 3px solid #38bdf8; }
        .pt-element-card[data-cat="actinide"] { border-left: 3px solid #f472b6; }

        .tp-title, .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tp-grid { display: flex; flex-direction: column; gap: 6px; }
        .tp-field { display: flex; flex-direction: row; align-items: center; gap: 8px; }
        .tp-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; width: 14px; }
        
        input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--border-glass-active);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .restore-btn, .tp-restore-btn {
            position: absolute;
            top: 16px;
            z-index: 9;
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .restore-btn { left: 16px; }
        .tp-restore-btn { right: 16px; }

        .ui-overlay::-webkit-scrollbar, .pt-scroll-area::-webkit-scrollbar, .orbits-scroll-area::-webkit-scrollbar { width: 4px; height: 4px; }
        .ui-overlay::-webkit-scrollbar-thumb, .pt-scroll-area::-webkit-scrollbar-thumb, .orbits-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 2px; }

        header h1 {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--text-accent);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.3);
        }

        .minimize-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .minimize-btn:hover { color: var(--text-main); }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--card-glass);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
        }

        .input-field { display: flex; flex-direction: column; gap: 4px; }
        .input-header { display: flex; justify-content: space-between; align-items: center; }
        .input-field label { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .action-link { font-size: 9px; color: var(--text-accent); cursor: pointer; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .action-link:hover { opacity: 1; text-decoration: underline; }

        button.apply-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-glass-active);
            background: var(--accent-glow);
            color: var(--text-accent);
            border-radius: 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        button.apply-btn:hover {
            background: rgba(147, 197, 253, 0.2);
            color: var(--text-main);
            box-shadow: 0 0 12px rgba(147, 197, 253, 0.15);
        }

        button.secondary-btn {
            padding: 8px;
            border: 1px solid var(--border-glass);
            background: var(--btn-glass);
            color: var(--text-sub);
            border-radius: 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
            width: 100%;
        }

        button.secondary-btn:hover {
            border-color: var(--border-glass-active);
            background: var(--btn-glass-hover);
            color: var(--text-main);
        }

        .orbits-scroll-area {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .orbit-row {
            display: grid;
            grid-template-columns: 46px 80px 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        .orbit-row .ex-input {
            width: 100%;
            text-align: center;
            padding: 3px;
            font-size: 10px;
        }

        .orbit-row .orbit-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .orbit-row .e-input {
            width: 100%;
            text-align: right;
            padding: 3px 6px;
            font-size: 10px;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--chk-bg);
            border: 1px solid var(--chk-border);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: background 0.2s ease;
        }

        input[type="checkbox"]:checked {
            background: var(--chk-checked-bg);
            border-color: var(--chk-tick-color);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -3px;
            left: 2px;
            font-size: 10px;
            font-weight: bold;
            color: var(--chk-tick-color);
        }

        .filter-list { display: flex; flex-direction: column; gap: 6px; }
        .filter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            background: var(--card-glass);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--text-sub);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="restore-btn" id="restoreBtn" style="display:none;" onclick="togglePanel(false)">☰</button>
    <button class="tp-restore-btn" id="tpRestoreBtn" style="display:none;" onclick="toggleTpPanel(false)">⧇</button>

    <div class="tp-overlay" id="tpOverlay">
        <div class="tp-title">
            <span>CAMERA POS & GOTO</span>
            <button class="minimize-btn" onclick="toggleTpPanel(true)">✕</button>
        </div>
        <div class="tp-grid">
            <div class="tp-field"><label>X</label><input type="text" id="tpX" placeholder="~"></div>
            <div class="tp-field"><label>Y</label><input type="text" id="tpY" placeholder="~"></div>
            <div class="tp-field"><label>Z</label><input type="text" id="tpZ" placeholder="~"></div>
        </div>
        <button class="apply-btn" onclick="teleportCamera()">GOTO POSITION</button>
        <div class="btn-group">
            <button class="secondary-btn" onclick="setInitialPosition()">SET INIT</button>
            <button class="secondary-btn" onclick="reloadInitialPosition()">RESET</button>
        </div>
    </div>

    <!-- Main UI Panel -->
    <div class="ui-overlay" id="uiOverlay">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>DIRAC QUANTUM 3D</h1>
            <button class="minimize-btn" onclick="togglePanel(true)">✕</button>
        </header>

        <div>
            <div class="section-title">Element Selector</div>
            <button class="secondary-btn" style="margin-top:6px;" onclick="openPeriodicTableModal()">PERIODIC TABLE ⊞</button>
        </div>

        <div>
            <div class="section-title">Quantum System Setup</div>
            <div class="input-card" style="margin-top:6px;">
                <div class="input-field">
                    <label>Atomic Number (Z)</label>
                    <input type="number" id="inputZ" value="6" onchange="rebuildQuantumModel()">
                </div>

                <div class="input-field">
                    <label>Max Principal Quantum Number (n)</label>
                    <input type="number" id="inputMaxN" value="2" min="1" max="12" onchange="generateOrbitsBuilder()">
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">
                <span>Suborbit Configuration</span>
                <span style="font-size:8px; color:var(--text-muted);">EX | ORBIT | ELEC</span>
            </div>
            
            <div class="orbits-scroll-area" id="orbitsBuilderContainer" style="margin-top:6px;"></div>
        </div>

        <div>
            <div class="input-card">
                <div class="input-header">
                    <label style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">Binding Energy En (eV)</label>
                    <span class="action-link" onclick="autoCalculateSuborbitEnergiesUI()">[CALC EN]</span>
                </div>
                <input type="text" id="inputEn" value="" placeholder="Calculated per split suborbit">
                <button class="apply-btn" style="margin-top:4px;" onclick="rebuildQuantumModel()">SOLVE DIRAC MODEL</button>
            </div>
        </div>

        <div>
            <div class="section-title">Orbital Opacity</div>
            <input type="range" id="opacitySlider" min="0.05" max="0.9" step="0.01" value="0.35" style="margin-top:6px;" oninput="updateOpacity(this.value)">
        </div>

        <div>
            <div class="section-title">Dirac j-Suborbit Filters</div>
            <div id="dynamicFilterContainer" class="filter-list" style="margin-top:6px;"></div>
        </div>
    </div>

    <!-- Floating Periodic Table Window -->
    <div class="pt-modal-backdrop" id="ptModalBackdrop" onclick="handleBackdropClick(event)">
        <div class="pt-modal-window" id="ptModalWindow">
            <div class="pt-modal-header">
                <div class="pt-modal-title">
                    <span>PERIODIC TABLE</span>
                    <span id="selectedElementTag" style="font-size:10px; color:var(--text-accent); font-weight:normal;">[118 Elements]</span>
                </div>
                <button class="close-btn" onclick="closePeriodicTableModal()">✕</button>
            </div>
            <div class="pt-scroll-area">
                <div class="pt-grid-container" id="ptGridContainer"></div>
            </div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

</body>
</html>
